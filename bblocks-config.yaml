# A short, descriptive name of this building block collection
name: OSPD Activity Types Register

# Short abstract for this collection (optional)
abstract: |
  The activity types of the OGC Open Science Persistent Demonstrator (OSPD), under stable
  `https://w3id.org/ogc/ospd/activity-type/` URIs: the generic activity types, grouped into families.

description: |
  The activity types of OSPD and the model they are described with: the activity type, geoprocessing and
  machine learning profiles of the Registered Item Model (`profiles/`), the catalogs (`core/`) and the generic
  activity types, one block and one concept scheme per family (`generic/<family>`). Specific types are defined
  by the participant registers, loaded from their ogcincubator forks, and point to a generic type with
  `skos:broader`. This register supersedes the [Activity Type Register](https://ogcincubator.github.io/activity-type-register/).

# Customize the following prefix (will be prepended to the path of the building blocks):
identifier-prefix: ogc.register.ospd.
# List of imports ("default" is an alias for the main OGC Building Blocks Register).
# An entry can also be an "@org/register" alias (e.g. "@ogc/main", equivalent to "default"),
# resolved against a Building Blocks meta-registry -- see "meta-registry" below -- instead of
# a full register.json URL.
imports:
  - default
  - https://ogcincubator.github.io/registered-item-model/build/register.json
# Whether to enable the (highly experimental) downcompiling of JSON schemas to an OpenAPI 3.0-compatible
# version
schema-oas30-downcompile: False

# SPARQL configuration: loads the OSPD Fuseki behind the Prez on every build (optional)
#   Authentication can be set through the sparql_username and sparql_password GitHub Workflow inputs
#   (see .github/workflow/process-bblocks.yml)
#
sparql:
  push: https://defs-hosted.opengis.net/fuseki-ospd/data   # SPARQL Graph Store Protocol endpoint
  query: https://defs-hosted.opengis.net/fuseki-ospd/query
  # Graph for the register (building block metadata); independent of where the register is hosted.
  graph: https://w3id.org/ogc/ospd/register
  resources:
    ontologies: true   # ontology files of each block (the profiles), in urn:ogc:bblocks/<id>/ontology
    data: true         # RDF data resources of each block (catalogs, activity types), in urn:ogc:bblocks/<id>/data

#                                             #   Do not put secrets here - this file is committed to git.
